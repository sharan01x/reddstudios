"""
# ---------------------------------------------------------------------------
#                         LAW AS CODE (KARNATAKA)
#            Transfer of Property, 1882 -- compiled into Python
#
#  This program is a compiler. It does not compile source into machine code.
#  It compiles human longing into legal property.
#
#  Each function is a statute. Each exception is a void.
#  Each comment is a magistrate's marginalia.
#
#  To run:   python3 lawascode.py
#  To read:  open in any editor. The law is the code.
# ---------------------------------------------------------------------------
"""

from __future__ import annotations
from dataclasses import dataclass, field
from enum import Enum, auto
from typing import Optional, List, Dict
from datetime import datetime


# ===========================================================================
#  CENTRAL STATUTES -- The Indian Parliament speaks first.
# ===========================================================================

class TransferOfPropertyAct1882:
    """
    Section 54: Sale is a transfer of ownership in exchange for a price paid,
    promised, or part-paid and part-promised.

    # NOTE: Price must be certain. An uncertain consideration voids the sale.
    #       Like faith, price cannot be vague.
    """
    @staticmethod
    def validate_sale_consideration(price: float) -> bool:
        return price > 0.0  # Zero rupees is a gift, not a sale.


class RegistrationAct1908:
    """
    Section 17: Instruments creating, declaring, assigning, limiting, or
    extinguishing any right, title, or interest in immovable property
    valued at one hundred rupees and upwards MUST be registered.

    # NOTE: An unregistered sale deed is not admissible as evidence of title.
    #       It exists, but it cannot speak in court. A mute document.
    """
    REQUIRED_VALUE_THRESHOLD: float = 100.0

    @classmethod
    def requires_registration(cls, value: float) -> bool:
        return value >= cls.REQUIRED_VALUE_THRESHOLD

    @staticmethod
    def verify_registered_at_sub_registrar(
        deed: Deed,
        sro_office: str
    ) -> bool:
        """
        A deed is not born until the Sub-Registrar stamps it.
        Bangalore Urban, Bangalore Rural, Mysuru, Belagavi --
        each office has its own index, its own delays, its own dust.
        """
        return deed.is_registered and deed.sro_jurisdiction == sro_office


class BenamiTransactionsProhibitionAct1988:
    """
    Section 3: No person shall enter into a benami transaction.

    # NOTE: The real owner hides behind a name. The law says: the veil is torn.
    #       Property held benami is liable to confiscation without compensation.
    """
    @staticmethod
    def is_benami(beneficial_owner: str, registered_owner: str) -> bool:
        """If the hands that paid are not the hands that hold, it is benami."""
        return beneficial_owner != registered_owner


class RERA2016:
    """
    The Real Estate (Regulation and Development) Act, 2016.

    Section 3: No promoter shall advertise, market, book, sell, offer for sale,
    or invite persons to purchase any apartment, plot, or building in a real
    estate project without registering the project with the Real Estate
    Regulatory Authority.

    # NOTE: Karnataka RERA Rules, 2017 apply here.
    #       The Authority sits in Bangalore. Project KH-RERA-XXXXXX.
    """
    AUTHORITY: str = "Karnataka Real Estate Regulatory Authority"

    @staticmethod
    def verify_project_registration(rera_id: Optional[str]) -> bool:
        """
        Without KH-RERA registration, the project is a ghost building.
        Buyers pour money into foundations that may never become floors.
        """
        return rera_id is not None and rera_id.startswith("KH-RERA-")

    @staticmethod
    def verify_escrow_account(funds_received: float, escrow_balance: float) -> bool:
        """
        Section 4(2)(l)(D): 70% of funds received must be deposited in
        a separate escrow account and utilised only for that project's costs.

        # FIXME: In practice, diversion is common. The code knows this.
        """
        return escrow_balance >= (funds_received * 0.70)


# ===========================================================================
#  KARNATAKA STATUTES -- The State speaks next. Its voice is local.
# ===========================================================================

class KarnatakaStampAct1957:
    """
    Article 20: Conveyance -- Sale of immovable property.

    Stamp duty in Karnataka is among the highest in India.
    The state takes its share before the buyer takes the key.

    # NOTE: Current rate (subject to amendment):
    #       5% of market value for general areas
    #       + 1% Registration fee
    #       + 2% Cess (in some municipal areas)
    #       + 10% surcharge on stamp duty
    #       = approximately 6.6% of guidance value.
    """
    STAMP_DUTY_RATE: float = 0.05
    REGISTRATION_FEE_RATE: float = 0.01
    SURCHARGE_RATE: float = 0.10  # On stamp duty only

    @classmethod
    def calculate_stamp_duty(cls, market_value: float) -> Dict[str, float]:
        stamp = market_value * cls.STAMP_DUTY_RATE
        reg_fee = market_value * cls.REGISTRATION_FEE_RATE
        surcharge = stamp * cls.SURCHARGE_RATE
        return {
            "stamp_duty": stamp,
            "registration_fee": reg_fee,
            "surcharge": surcharge,
            "total": stamp + reg_fee + surcharge,
        }

    @classmethod
    def is_stamp_sufficient(cls, market_value: float, paid: float) -> bool:
        required = cls.calculate_stamp_duty(market_value)["total"]
        return paid >= required


class KarnatakaLandRevenueAct1964:
    """
    Section 127: Mutation of names in the register of account No. 1 (Rahan).

    # NOTE: Mutation is not title. It is only revenue record.
    #       But without mutation, the new owner cannot pay tax in his own name.
    #       And without paying tax, the land aches in administrative limbo.
    """
    @staticmethod
    def verify_mutation(khata_holder: str, new_owner: str) -> bool:
        return khata_holder == new_owner


class KarnatakaPTCLAct1978:
    """
    Karnataka Scheduled Castes and Scheduled Tribes
    (Prohibition of Transfer of Certain Lands) Act, 1978.

    # WARNING: Land granted to SC/ST beneficiaries cannot be transferred.
    #          "Akram Sakram" -- regularisation -- is sometimes possible,
    #          but the shadow of this Act falls across many titles in Karnataka.
    #          A beautiful farm with a PTCL defect is a landmine in a garden.
    """
    @staticmethod
    def is_granted_land(land_type: str) -> bool:
        return land_type.lower() in ("sc grant", "st grant", "scheduled grant")

    @staticmethod
    def can_transfer(granted: bool, regularised: bool = False) -> bool:
        if not granted:
            return True
        # ERROR: Cannot transfer granted land unless regularised under Akram Sakram.
        #        ^^^ Type mismatch: legal title expected, got 'conditional future'.
        return regularised


# ===========================================================================
#  LAND USE -- Conversion is conversion. Agricultural to non-agricultural.
# ===========================================================================

class LandUseType(Enum):
    AGRICULTURAL = auto()
    RESIDENTIAL = auto()
    COMMERCIAL = auto()
    INDUSTRIAL = auto()
    MIXED_USE = auto()


class DCConversionRequired(Exception):
    """
    Section 95 of Karnataka Land Revenue Act, 1964:
    No agricultural land shall be used for non-agricultural purpose without
    obtaining permission from the Deputy Commissioner.

    # ERROR: DC conversion missing.
    #        ^^^ Semantic error: 'farmland' cannot be implicitly cast to 'homesite'
    #        Hint: Apply to the Deputy Commissioner's office. Attach Form 18.
    #              Wait. Then wait more.
    """
    pass


class KhataType(Enum):
    """
    A-Khata: Full regularisation. Clean title. Bankable. Mortgageable. The ideal.
    B-Khata: Recorded, but with deviations. Unauthorised construction,
             pending DC conversion, or revenue dues. Bank loans are difficult.
             Like a person known to the state but not fully accepted.

    # NOTE: The bifurcation is Bangalore's special wound. A gift to poets.
    """
    A = "A-Khata"  # The state embraces this property.
    B = "B-Khata"  # The state acknowledges but does not fully legitimise.


# ===========================================================================
#  CORE DATA STRUCTURES -- The atoms of property.
# ===========================================================================

@dataclass
class SurveyNumber:
    """Every field has a number. The state counts what the farmer sows."""
    number: str
    village: str
    hobli: str
    taluk: str
    district: str


@dataclass
class Property:
    """
    Immovable property under Indian law: land, benefits arising out of land,
    and things attached to the earth or permanently fastened to anything
    attached to the earth.

    # NOTE: Trees standing are immovable. Timber cut is movable.
    #       The same object changes legal nature by an act of severance.
    """
    survey: SurveyNumber
    extent_acres: float
    current_use: LandUseType
    dc_converted: bool = False
    is_scst_grant: bool = False
    khata: KhataType = KhataType.A
    guidance_value_per_sqft: float = 0.0
    market_value: float = 0.0
    building_plan_approved: bool = False


@dataclass
class Party:
    """A person before the law. The law does not ask if they dream."""
    name: str
    is_promoter: bool = False


@dataclass
class Deed:
    """
    The instrument of transfer. A document is not a deed unless it is
    executed and attested.

    # NOTE: Two witnesses minimum for sale deed under Indian Registration Act.
    #       Their names are witnesses to the witnessing. The chain of trust.
    """
    deed_number: str
    execution_date: datetime
    vendor: Party
    purchaser: Party
    property: Property
    sale_price: float
    witnesses: List[str] = field(default_factory=list)
    is_registered: bool = False
    sro_jurisdiction: str = ""
    stamp_duty_paid: float = 0.0
    rera_id: Optional[str] = None
    encumbrances: List[str] = field(default_factory=list)


# ===========================================================================
#  THE COMPILER -- Where law becomes executable.
# ===========================================================================

class CompilationError:
    """A defect in the legal source code. Rendered as an IDE-style diagnostic."""
    def __init__(self, file: str, line: int, severity: str, code: str, message: str):
        self.file = file
        self.line = line
        self.severity = severity  # ERROR, WARNING, INFO
        self.code = code
        self.message = message

    def __str__(self) -> str:
        return f"{self.file}:{self.line}: {self.severity}: [{self.code}] {self.message}"


class LegalCompiler:
    """
    The compiler reads a deed as source and produces either:
        (a) a valid title -- clean output, or
        (b) a diagnostic log -- the errors that prevent legal existence.

    Each method is a statutory filter. The deed must pass all filters
    to be compiled into a marketable title.
    """

    def __init__(self):
        self.diagnostics: List[CompilationError] = []
        self.current_source_file = "deed.py"  # The fiction of a single file.
        self._line_counter = 0

    def _emit(self, severity: str, code: str, message: str):
        self._line_counter += 1
        err = CompilationError(
            file=self.current_source_file,
            line=self._line_counter,
            severity=severity,
            code=code,
            message=message,
        )
        self.diagnostics.append(err)

    def compile(self, deed: Deed) -> bool:
        """
        Compile a deed into a title.
        Returns True if the title is marketable (clean compile).
        Returns False if there are defects (compilation failed).
        """
        print("=" * 72)
        print("LEGAL COMPILER -- KARNATAKA EDITION")
        print(f"Compiling deed {deed.deed_number}...")
        print("=" * 72)
        print()

        # -- Phase 1: Lexical Analysis ---------------------------------------
        # Can the document even be read? Is it attested? Is it certain?
        self._check_attestation(deed)
        self._check_consideration(deed)

        # -- Phase 2: Semantic Analysis -- Statutory Compliance ----------------
        self._check_registration(deed)
        self._check_stamp_duty(deed)
        self._check_rera(deed)
        self._check_dc_conversion(deed)
        self._check_ptcl(deed)
        self._check_khata(deed)
        self._check_encumbrances(deed)
        self._check_benami(deed)

        # -- Phase 3: Linking -- Mutation & Revenue Records -------------------
        self._check_mutation_readiness(deed)

        # -- Build Report -----------------------------------------------------
        print()
        print("-" * 72)
        errors = [d for d in self.diagnostics if d.severity == "ERROR"]
        warnings = [d for d in self.diagnostics if d.severity == "WARNING"]
        infos = [d for d in self.diagnostics if d.severity == "INFO"]

        for d in self.diagnostics:
            print(d)

        print()
        print(f"Build complete: {len(errors)} error(s), {len(warnings)} warning(s), {len(infos)} note(s).")
        if errors:
            print("TITLE NOT MARKETABLE. Compilation failed.")
            print()
            print("# The property exists in the physical world,")
            print("# but it does not yet exist in the legal world.")
            print("# The code refuses to compile longing into ownership.")
            return False
        else:
            print("CLEAN BUILD. Title is marketable.")
            print()
            print("# The deed has passed through the statute-machinery.")
            print("# The state acknowledges: this land has an owner.")
            return True

    # -- Individual Statutory Checks ----------------------------------------

    def _check_attestation(self, deed: Deed):
        if len(deed.witnesses) < 2:
            self._emit(
                "ERROR", "REG1908-ATT",
                f"Sale deed requires minimum 2 witnesses. Found {len(deed.witnesses)}. "
                "Unattested deed is inadmissible as evidence of transfer."
            )
        else:
            self._emit("INFO", "REG1908-OK", f"Attested by {len(deed.witnesses)} witness(es).")

    def _check_consideration(self, deed: Deed):
        if not TransferOfPropertyAct1882.validate_sale_consideration(deed.sale_price):
            self._emit(
                "ERROR", "TOP1882-SALE",
                "Sale consideration is zero or unspecified. "
                "Section 54 requires a price -- paid, promised, or part-paid and part-promised."
            )
        else:
            self._emit("INFO", "TOP1882-OK", f"Consideration of INR {deed.sale_price:,.2f} is valid.")

    def _check_registration(self, deed: Deed):
        if not deed.is_registered:
            self._emit(
                "ERROR", "REG1908-NOREG",
                f"Deed {deed.deed_number} is UNREGISTERED. "
                "Section 17: Sale of immovable property > INR 100 must be registered. "

    IVA -- 10% para vivienda nueva (promotor), 21% para locales comerciales.

    # NOTA: Madrid tiene un ITP más bajo que otras comunidades (Andalucía 8-10%).
    #       Es una ventaja fiscal de la capital. El Estado cede; Madrid atrae.
    """

    IVA_VIVIENDA_NUEVA: float = 0.10
    IVA_LOCAL_COMERCIAL: float = 0.21

    @classmethod
    def calculate_transfer_tax(cls, price: float, is_new: bool, is_commercial: bool) -> Dict[str, float]:

            tax = price * cls.IVA_LOCAL_COMERCIAL
            return {"type": "IVA", "rate": cls.IVA_LOCAL_COMERCIAL, "amount": tax}
        if is_new:
            tax = price * cls.IVA_VIVIENDA_NUEVA
            return {"type": "IVA", "rate": cls.IVA_VIVIENDA_NUEVA, "amount": tax}
        tax = price * cls.ITP_RATE_MADRID
        return {"type": "ITP", "rate": cls.ITP_RATE_MADRID, "amount": tax}

            severidad=severidad,
            codigo=codigo,

        print("=" * 72)
        print()

        # -- Fase 1: Análisis Léxico -----------------------------------------
        # ¿Se puede leer el documento? ¿Es público? ¿Está firmado?
        self._check_escritura_publica(escritura)
        self._check_consideracion(escritura)

        # -- Fase 2: Análisis Semántico -- Cumplimiento Estatutario ----------
        self._check_inscripcion_registro(escritura)
        self._check_impuestos(escritura)
        self._check_calificacion_suelo(escritura)
        self._check_vpo(escritura)
        self._check_regimen_propiedad(escritura)
        self._check_ite(escritura)
        self._check_cedula_habitabilidad(escritura)
        self._check_certificado_energetico(escritura)
        self._check_cargas(escritura)

        # -- Fase 3: Enlace -- Catastro e Impuestos Locales -------------------
        self._check_ibi_al_dia(escritura)

        # -- Informe de Compilación ------------------------------------------
        print()
        print("-" * 72)
        errores = [d for d in self.diagnosticos if d.severidad == "ERROR"]
        advertencias = [d for d in self.diagnosticos if d.severidad == "WARNING"]
        infos = [d for d in self.diagnosticos if d.severidad == "INFO"]

        for d in self.diagnosticos:
            print(d)

        print()
        print(f"Compilación completa: {len(errores)} error(es), {len(advertencias)} advertencia(s), {len(infos)} nota(s).")
        if errores:
            print("TÍTULO NO MERCANTIL. Compilación fallida.")
            print()
            print("# La finca existe en el mundo físico,")
            print("# pero aún no existe en el mundo jurídico.")
            print("# El código se niega a compilar el anhelo en propiedad.")
            return False
        else:
            print("COMPILACIÓN LIMPIA. Título mercantil.")
            print()
            print("# La escritura ha pasado por la maquinaria estatutaria.")
            print("# El Estado reconoce: esta tierra tiene dueño.")
            return True

    # -- Comprobaciones Estatutarias Individuales --------------------------

    def _check_escritura_publica(self, escritura: Escritura):
        if not escritura.es_escritura_publica:
            self._emitir(
                "ERROR", "LH1946-EP",
                f"Escritura {escritura.escritura_numero} NO ES PÚBLICA. "
                "Art. 146 LH: La enajenación requiere escritura pública para inscribirse. "
                "Sin escritura pública, no hay fe. Sin fe, no hay registro."
            )
            # =================================================================
            #  ERROR: la escritura pública es el acta de nacimiento del contrato.
            #         Sin ella, el documento es un borrador sin fuerza.
            #         ^^^ Semantic error: escritura.tipo == 'privada'
            #         Pista: Comparecer ante Notario. Identificarse. Firmar. Pagar.
            #                El notario es el compilador humano. No se puede evitar.
            # =================================================================
        elif not escritura.firma_notario:
            self._emitir(
                "ERROR", "LH1946-NOT",
                "Escritura pública sin firma de notario. El notario da fe pública. "
                "Sin su firma, la escritura es un papel sin alma."
            )
        else:
            self._emitir("INFO", "LH1946-OK", f"Escritura pública ante Notario {escritura.firma_notario}.")

    def _check_consideracion(self, escritura: Escritura):
        if not CodigoCivil1889.validate_sale_consideration(escritura.precio_venta):
            self._emitir(
                "ERROR", "CC1889-PRECIO",
                "Precio de venta cero o no especificado. "
                "Art. 1445 CC: El precio debe ser cierto o determinable."
            )
        else:
            self._emitir("INFO", "CC1889-OK", f"Precio de EUR {escritura.precio_venta:,.2f} es válido.")

    def _check_inscripcion_registro(self, escritura: Escritura):
        if not escritura.inscrita_registro:
            self._emitir(
                "ERROR", "LH1946-NOREG",
                f"Escritura {escritura.escritura_numero} NO INSCRITA. "
                "Art. 38 LH: La inscripción es necesaria para que el derecho "
                "se oponga a terceros. Sin inscripción, la compra es válida pero frágil."
            )
            # =================================================================
            #  ERROR: la inscripción registral es el escudo contra el mundo.
            #         Sin ella, un tercero de buena fe puede tener mejor derecho.
            #         ^^^ Semantic error: escritura.inscrita == False
            #         Pista: Acudir al Registro de la Propiedad. Presentar escritura.
            #                Pagar tasas. Esperar la presentación. El registro habla.
            # =================================================================
        else:
            self._emitir("INFO", "LH1946-REG", f"Inscrita en Registro: {escritura.oficina_registro}")

    def _check_impuestos(self, escritura: Escritura):
        tax_info = ITPvsIVA.calculate_transfer_tax(
            escritura.precio_venta,
            is_new=False,  # Simplificación: asumimos reventa
            is_commercial=False
        )
        required_itp = tax_info["amount"]
        if escritura.itp_pagado < required_itp:
            deficit = required_itp - escritura.itp_pagado
            self._emitir(
                "ERROR", "ITP-MADRID",
                f"Déficit de ITP de EUR {deficit:,.2f}. "
                f"Pagado EUR {escritura.itp_pagado:,.2f}, requerido EUR {required_itp:,.2f}. "
                "El ITP es el precio de la seguridad jurídica en Madrid."
            )
        else:
            self._emitir("INFO", "ITP-OK", f"ITP satisfecho (EUR {escritura.itp_pagado:,.2f}).")

        required_ajd = AJD_Madrid.calculate_ajd(escritura.precio_venta)
        if escritura.ajd_pagado < required_ajd:
            deficit = required_ajd - escritura.ajd_pagado
            self._emitir(
                "ERROR", "AJD-MADRID",
                f"Déficit de AJD de EUR {deficit:,.2f}. "
                "Los Actos Jurídicos Documentados gravan la fe pública. "
                "Sin pagarlos, la escritura no tiene sello completo."
            )
        else:
            self._emitir("INFO", "AJD-OK", f"AJD satisfecho (EUR {escritura.ajd_pagado:,.2f}).")

    def _check_calificacion_suelo(self, escritura: Escritura):
        inm = escritura.inmueble
        if inm.calificacion == CalificacionSuelo.RUSTICO and not inm.requalificado:
            self._emitir(
                "ERROR", "LS2001-CALIF",
                f"Finca ref. {inm.catastro.ref_catastral} es suelo RÚSTICO "
                f"sin requalificación. Ley 9/2001 Madrid: suelo rústico no edificable. "
                "El Ayuntamiento de Madrid debe autorizar el cambio de calificación."
            )
            # =================================================================
            #  WARNING: La calificación urbanística es el ADN de la parcela.
            #           Sin requalificación, la tierra sueña con ser casa
            #           pero despierta siendo campo.
            #           ^^^ TypeError: no se puede convertir 'SueloRustico' a 'ParcelaUrbana'
            #           sin RequalificacionUrbanistica(solicitar=True, esperar=infinito)
            # =================================================================
        elif inm.calificacion == CalificacionSuelo.RUSTICO and inm.requalificado:
            self._emitir("INFO", "LS2001-OK", "Requalificación urbanística concedida.")

    def _check_vpo(self, escritura: Escritura):
        inm = escritura.inmueble
        if inm.es_vpo:
            self._emitir(
                "ERROR", "VPO-MADRID",
                f"Finca ref. {inm.catastro.ref_catastral} es Vivienda de Protección Oficial. "
                "Normativa VPO Comunidad de Madrid: enajenación restringida hasta liberación. "
                "El título es nulo de pleno derecho si no se cumple el plazo de vigencia."
            )
            # =================================================================
            #  FATAL ERROR: Vivienda de Protección Oficial detectada.
            #               ^^^ Esta vivienda fue entregada a una familia con precio limitado.
            #                   La Comunidad de Madrid recuerda. La enajenación no es defectuosa;
            #                   es imposible. No hay arreglo. Solo hay esperar o solicitar liberación.
            # =================================================================

    def _check_regimen_propiedad(self, escritura: Escritura):
        if escritura.inmueble.regimen == RegimenPropiedad.HORIZONTAL:
            self._emitir(
                "WARNING", "PH-CP",
                "Régimen de Propiedad Horizontal detectado. "
                "Verificar que la comunidad de propietarios está al corriente de cuotas. "
                "Sin certificación de la comunidad, la venta es arriesgada."
            )
            # =================================================================
            #  WARNING: La Propiedad Horizontal es la sociedad forzosa de vecinos.
            #           No es ilegal, pero tiene deudas ocultas: la escalera, el ascensor,
            #           la reparación del tejado. La cuota pendiente es una hipoteca social.
            #           ^^^ DeprecationWarning: RegimenPropiedad.HORIZONTAL requiere
            #               certificación de la comunidad y cuotas al día.
            # =================================================================
        else:
            self._emitir("INFO", "PH-OK", "Propiedad plena. Sin comunidad de vecinos.")

    def _check_ite(self, escritura: Escritura):
        inm = escritura.inmueble
        if inm.anios_edificio >= 50:
            if not ITEComunidadMadrid.verify_ite_passed(inm.anios_edificio, escritura.ite_status):
                self._emitir(
                    "ERROR", "ITE-MADRID",
                    f"Edificio de {inm.anios_edificio} años sin ITE favorable. "
                    "Ley 8/2013 Madrid: ITE obligatoria para edificios > 50 años. "
                    "Sin ITE, la venta carece de garantía estructural."
                )
            else:
                self._emitir("INFO", "ITE-OK", f"ITE favorable para edificio de {inm.anios_edificio} años.")

    def _check_cedula_habitabilidad(self, escritura: Escritura):
        if escritura.inmueble.anios_edificio < 5 and not escritura.cedula_habitabilidad:
            self._emitir(
                "WARNING", "CEDULA-MADRID",
                "Vivienda nueva o rehabilitada sin Cédula de Habitabilidad. "
                "El Ayuntamiento de Madrid exige cédula para primera ocupación. "
                "Sin ella, no se puede habitar legalmente."
            )
        elif escritura.cedula_habitabilidad:
            self._emitir("INFO", "CEDULA-OK", "Cédula de Habitabilidad en vigor.")

    def _check_certificado_energetico(self, escritura: Escritura):
        if not CertificadoEnergetico.verify_energy_label(escritura.certificado_energetico):
            self._emitir(
                "WARNING", "CEE-RD235",
                f"Certificado energético ausente o inválido: '{escritura.certificado_energetico}'. "
                "RD 235/2013: obligatorio en venta y alquiler. Etiqueta A-G requerida. "
                "Sin certificado, la venta es válida pero sancionable."
            )
        else:
            self._emitir("INFO", "CEE-OK", f"Certificado energético: {escritura.certificado_energetico}.")

    def _check_cargas(self, escritura: Escritura):
        if escritura.cargas:
            for carga in escritura.cargas:
                self._emitir(
                    "WARNING", "CARGA-REG",
                    f"Carga sobre el título: {carga}. "
                    "Nota simple registral muestra hipoteca/carga previa. "
                    "Mercantilidad condicionada a cancelación."
                )
        else:
            self._emitir("INFO", "CARGA-OK", "Nota simple registral limpia de cargas.")

    def _check_ibi_al_dia(self, escritura: Escritura):
        self._emitir(
            "INFO", "IBI-MADRID",
            f"Verificar IBI al día en Ayuntamiento de Madrid. "
            f"Ref. catastral: {escritura.inmueble.catastro.ref_catastral}. "
            "El IBI es la cara fiscal de la propiedad."
        )
